name: Update opencode README plugins
on:
  push:
    branches: [main]
    paths: ["opencode.jsonc"]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Parse plugins and update README
        run: node scripts/update-readme.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: sync plugin list in README" && git push)
