name: Update opencode README plugins
on:
  push:
    branches: [main]
    paths: ["opencode.jsonc"]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Parse plugins and update README
        run: node scripts/update-readme.mjs

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README is already up to date; nothing to commit."
            exit 0
          fi
          # main requires verified commits, so create the commit through the API:
          # a commit the Actions bot makes with no custom author or committer is
          # signed by GitHub and satisfies the required_signatures rule.
          base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)"
          base_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${base_sha}" --jq .tree.sha)"
          blob_sha="$(jq -n --arg content "$(base64 -w0 README.md)" '{content: $content, encoding: "base64"}' | gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          tree_sha="$(jq -n --arg base "$base_tree" --arg sha "$blob_sha" '{base_tree: $base, tree: [{path: "README.md", mode: "100644", type: "blob", sha: $sha}]}' | gh api "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit_sha="$(jq -n --arg msg "chore: sync plugin list in README" --arg tree "$tree_sha" --arg parent "$base_sha" '{message: $msg, tree: $tree, parents: [$parent]}' | gh api "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}" -f sha="${commit_sha}"
          echo "Committed README update as ${commit_sha}"
