name: Update opencode README plugins
on:
  push:
    branches: [main]
    paths: ["opencode.jsonc"]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Parse plugins and update README
        run: |
          node - <<'NODEEOF'
          const fs = require('fs');
          const https = require('https');

          function httpsGet(url) {
            return new Promise((resolve, reject) => {
              https.get(url, { headers: { 'User-Agent': 'github-actions' } }, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve({ status: res.statusCode, body: data }));
              }).on('error', reject);
            });
          }

          function normalizeGitUrl(url) {
            if (!url) return null;
            return url
              .replace(/^git\+/, '')
              .replace(/^git:\/\//, 'https://')
              .replace(/\.git$/, '')
              .replace(/^ssh:\/\/git@/, 'https://')
              .replace(/^git@github\.com:/, 'https://github.com/');
          }

          async function main() {
            const content = fs.readFileSync('opencode.jsonc', 'utf8');
            const stripped = content
              .replace(/\/\*[\s\S]*?\*\//g, '')   // block comments
              .replace(/\/\/.*/g, '');              // line comments
            const plugins = JSON.parse(stripped).plugin || [];

            const rows = [];
            for (const entry of plugins) {
              if (entry.startsWith('file://')) {
                const filename = entry.replace(/^file:\/\/.*\//, '');
                rows.push(`| ${filename} | Local plugin (\`plugins/${filename}\`) |`);
              } else {
                // Strip version suffix, keeping scoped package name intact
                const pkgName = entry
                  .replace(/(@[^/]+\/[^@]+)@.*$/, '$1')
                  .replace(/^([^@][^@]*)@.*$/, '$1');
                try {
                  const encoded = pkgName.replace('/', '%2F');
                  const res = await httpsGet(`https://registry.npmjs.org/${encoded}`);
                  if (res.status === 200) {
                    const meta = JSON.parse(res.body);
                    const rawUrl = meta.repository?.url || '';
                    const repoUrl = normalizeGitUrl(rawUrl);
                    if (repoUrl && repoUrl.includes('github.com')) {
                      rows.push(`| ${pkgName} | [${repoUrl}](${repoUrl}) |`);
                    } else {
                      rows.push(`| ${pkgName} | [https://www.npmjs.com/package/${pkgName}](https://www.npmjs.com/package/${pkgName}) |`);
                    }
                  } else {
                    rows.push(`| ${pkgName} | [https://www.npmjs.com/package/${pkgName}](https://www.npmjs.com/package/${pkgName}) |`);
                  }
                } catch (e) {
                  rows.push(`| ${pkgName} | [https://www.npmjs.com/package/${pkgName}](https://www.npmjs.com/package/${pkgName}) |`);
                }
              }
            }

            const table = [
              '| Plugin | Source |',
              '|--------|--------|',
              ...rows,
            ].join('\n');

            // Replace the Plugins section in README
            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /(## Plugins\n\n)[\s\S]*?(\n\n## )/,
              `$1${table}$2`
            );

            // Update Last Synced timestamp
            const now = new Date().toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');
            const withTimestamp = updated.replace(
              /(## Last Synced\n\n).*/,
              `$1${now}`
            );

            fs.writeFileSync('README.md', withTimestamp);
            console.log('README updated successfully.');
            console.log('New table:\n' + table);
          }

          main().catch(e => { console.error(e); process.exit(1); });
          NODEEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: sync plugin list in README" && git push)
